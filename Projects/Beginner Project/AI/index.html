<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER SHOP 🔥</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
            cursor: none;
        }

        /* Custom Cursor */
        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
            box-shadow: 0 0 20px #ff00ff;
        }

        .cursor.grow {
            transform: scale(2);
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 80%, #ff00ff33 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, #00ffff33 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, #ffff0033 0%, transparent 50%);
            animation: bgShift 20s ease infinite;
        }

        @keyframes bgShift {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1rem 2rem;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            border-bottom: 2px solid #ff00ff;
            box-shadow: 0 0 50px #ff00ff20;
        }

        .nav {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            position: relative;
            transition: all 0.3s ease;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::before {
            width: 100%;
        }

        .nav-links a:hover {
            text-shadow: 0 0 20px #ff00ff;
        }

        .cart-btn {
            position: relative;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px #ff00ff50;
        }

        .cart-btn:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 50px #ff00ff80;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ffff00;
            color: #000;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Hero */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .hero-content h1 {
            font-family: 'Orbitron', monospace;
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 2s ease infinite;
            text-shadow: 0 0 50px #ff00ff50;
        }

        .hero-content p {
            font-size: 1.5rem;
            margin-bottom: 3rem;
            opacity: 0.9;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-btn {
            display: inline-block;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            color: #000;
            padding: 1.5rem 3rem;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 40px #ff00ff60;
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }

        .cta-btn:hover::before {
            left: 100%;
        }

        .cta-btn:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 60px #ff00ff80;
        }

        /* Products */
        .products {
            padding: 10rem 2rem 5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-family: 'Orbitron', monospace;
            font-size: 3.5rem;
            margin-bottom: 4rem;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 3rem;
        }

        .product-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,0,255,0.3);
            border-radius: 25px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            cursor: none;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .product-card:hover::before {
            transform: scaleX(1);
        }

        .product-card:hover {
            transform: translateY(-20px) rotateX(5deg);
            box-shadow: 0 30px 80px rgba(255,0,255,0.4);
            border-color: #ff00ff;
        }

        .product-icon {
            font-size: 5rem;
            display: block;
            text-align: center;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 20px #ff00ff);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .product-name {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .product-price {
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(45deg, #00ffff, #ffff00);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        .add-cart-btn {
            width: 100%;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            color: #000;
            border: none;
            padding: 1rem;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: none;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .add-cart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 40px #ff00ff60;
        }

        /* Cart Modal */
        .cart-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(30px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .cart-modal.active {
            display: flex;
            animation: modalSlide 0.5s ease;
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .cart-content {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(30px);
            border: 2px solid #ff00ff;
            border-radius: 25px;
            padding: 3rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .cart-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1.5rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .cart-item-icon {
            font-size: 3rem;
            filter: drop-shadow(0 0 15px #00ffff);
        }

        .cart-item-info h4 {
            font-family: 'Orbitron', monospace;
            margin-bottom: 0.5rem;
        }

        .cart-item-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ffff;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255,255,255,0.1);
            padding: 0.5rem 1rem;
            border-radius: 25px;
            border: 1px solid #ff00ff;
        }

        .qty-btn {
            background: #ff00ff;
            border: none;
            color: #000;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .qty-btn:hover {
            transform: scale(1.2);
            box-shadow: 0 0 20px #ff00ff;
        }

        .total {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #ff00ff;
        }

        .total-price {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ffff00, #00ffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(45deg, #ffff00, #00ffff);
            color: #000;
            border: none;
            padding: 1.5rem;
            border-radius: 25px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkout-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 50px #ffff0060;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .products-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            
            .hero-content h1 {
                font-size: 3rem;
            }
        }

        /* Scroll animations */
        .reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s ease;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="cursor" id="cursor"></div>
    <div class="bg-animation"></div>

    <!-- Header -->
    <header class="header">
        <nav class="nav">
            <div class="logo">CYBER<span style="color: #ff00ff;">SHOP</span></div>
            <ul class="nav-links">
                <li><a href="#home">HOME</a></li>
                <li><a href="#products">PRODUCTS</a></li>
                <li><a href="#about">ABOUT</a></li>
            </ul>
            <button class="cart-btn" id="cartBtn">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </nav>
    </header>

    <!-- Hero -->
    <section class="hero" id="home">
        <div class="hero-content reveal">
            <h1>CYBER SHOP</h1>
            <p> NEXT LEVEL GEAR | NEON VIBES | FUTURE PROOF </p>
            <a href="#products" class="cta-btn">ENTER THE MATRIX</a>
        </div>
    </section>

    <!-- Products -->
    <section class="products" id="products">
        <h2 class="section-title reveal">NEON COLLECTION</h2>
        <div class="products-grid" id="productsGrid">
            <!-- Products loaded by JS -->
        </div>
    </section>

    <!-- Cart Modal -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <h3 class="cart-title">🛒 SHOPPING CART</h3>
            <div id="cartItems"></div>
            <div class="total">
                <div class="total-price">$<span id="totalPrice">0</span></div>
                <button class="checkout-btn" id="checkoutBtn"> CHECKOUT</button>
            </div>
        </div>
    </div>

    <script>
        // Products - Cyberpunk Edition 
        const products = [
            { id: 1, name: 'NEON HEADSET', price: 299, icon: '🎧', desc: 'Quantum Audio' },
            { id: 2, name: 'CYBER WATCH', price: 599, icon: '⌚', desc: 'Holo Display' },
            { id: 3, name: 'PLASMA SPEAKER', price: 199, icon: '🔊', desc: 'Bass Cannon' },
            { id: 4, name: 'NEURAL MOUSE', price: 89, icon: '🖱️', desc: 'Mind Control' },
            { id: 5, name: 'QUANTUM KEYBOARD', price: 399, icon: '⌨️', desc: 'RGB Matrix' },
            { id: 6, name: 'FUSION POWERBANK', price: 149, icon: '🔋', desc: 'Infinite Charge' }
        ];

        let cart = [];

        // DOM Elements
        const cursor = document.getElementById('cursor');
        const cartBtn = document.getElementById('cartBtn');
        const cartModal = document.getElementById('cartModal');
        const cartCount = document.getElementById('cartCount');
        const productsGrid = document.getElementById('productsGrid');
        const cartItems = document.getElementById('cartItems');
        const totalPrice = document.getElementById('totalPrice');
        const checkoutBtn = document.getElementById('checkoutBtn');

        // Custom Cursor
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.querySelectorAll('a, button, .product-card').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('grow'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('grow'));
        });

        // Render Products
        function renderProducts() {
            productsGrid.innerHTML = products.map(product => `
                <div class="product-card reveal" data-product-id="${product.id}">
                    <div class="product-icon">${product.icon}</div>
                    <h3 class="product-name">${product.name}</h3>
                    <div class="product-price">$${product.price}</div>
                    <p style="text-align: center; opacity: 0.7; margin-bottom: 1.5rem;">${product.desc}</p>
                    <button class="add-cart-btn" onclick="addToCart(${product.id})">
                        <i class="fas fa-cart-plus"></i> ADD TO CART
                    </button>
                </div>
            `).join('');
        }

        // Cart Functions
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({...product, quantity: 1});
            }
            updateCart();
        }

        function updateCartQuantity(id, change) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                updateCart();
            }
        }

        function updateCart() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            cartCount.textContent = totalItems;
            totalPrice.textContent = total.toFixed(2);
            
            cartItems.innerHTML = cart.length ? 
                cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-icon">${item.icon}</div>
                        <div class="cart-item-info">
                            <h4>${item.name}</h4>
                            <div class="cart-item-price">$${item.price} x ${item.quantity}</div>
                        </div>
                        <div class="quantity-controls">
                            <button class="qty-btn" onclick="updateCartQuantity(${item.id}, -1)">−</button>
                            <span style="font-weight: bold; font-size: 1.2rem;">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateCartQuantity(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `).join('') : 
                '<div style="text-align: center; padding: 3rem; opacity: 0.5;"><i class="fas fa-shopping-cart" style="font-size: 4rem; margin-bottom: 1rem;"></i><h3>YOUR CART IS EMPTY</h3></div>';
        }

        // Event Listeners
        cartBtn.addEventListener('click', () => cartModal.classList.add('active'));
        checkoutBtn.addEventListener('click', () => {
            if (cart.length) {
                alert(` CHECKOUT SUCCESS!\nTotal: $${cart.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2)}`);
                cart = [];
                cartModal.classList.remove('active');
                updateCart();
            }
        });

        // Close modal
        cartModal.addEventListener('click', (e) => {
            if (e.target === cartModal) cartModal.classList.remove('active');
        });

        // Scroll Animations
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        });

        // Smooth Scroll
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Initialize
        renderProducts();
        updateCart();
        
        // Observe animations
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
